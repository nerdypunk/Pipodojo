<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132" role="img" aria-label="Pipo, the Pipodojo robot">
  <!-- Pipo as drawn on pipodojo.com's front page (src/ui/Pipo.tsx, happy mood), with the same gentle float. -->
  <style>
    @keyframes float { 50% { transform: translateY(-4px); } }
    @keyframes shadow { 50% { transform: scaleX(0.85); opacity: 0.18; } }
    @keyframes core { 50% { opacity: 0.55; } }
    .float { animation: float 3.2s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3.2s ease-in-out infinite; }
    .core { animation: core 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .float, .shadow, .core { animation: none; } }
  </style>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="0.55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d9530a"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2d96"/><stop offset="1" stop-color="#120e2b"/></linearGradient>
    <radialGradient id="glowcore"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#9cc2ff"/><stop offset="1" stop-color="#6e5cf2" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse class="shadow" cx="60" cy="127" rx="24" ry="4" fill="#2d2470" opacity="0.3"/>
  <g class="float">
    <line x1="60" y1="21" x2="60" y2="9" stroke="#3b2d96" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="7" r="5" fill="#b2a9ff" filter="url(#glow)"/>
    <path d="M52 110 Q60 130 68 110 Z" fill="#fbbf24"/>
    <path d="M55 110 Q60 122 65 110 Z" fill="#ff7a1a"/>
    <path d="M30 96 L40 92 L40 106 Z" fill="#3b2d96"/>
    <path d="M90 96 L80 92 L80 106 Z" fill="#3b2d96"/>
    <rect x="40" y="86" width="40" height="26" rx="13" fill="url(#shell)"/>
    <circle class="core" cx="60" cy="99" r="8" fill="url(#glowcore)"/>
    <circle cx="16" cy="50" r="8" fill="#3b2d96"/>
    <circle cx="16" cy="50" r="4" fill="none" stroke="#b2a9ff" stroke-width="2"/>
    <circle cx="104" cy="50" r="8" fill="#3b2d96"/>
    <circle cx="104" cy="50" r="4" fill="none" stroke="#b2a9ff" stroke-width="2"/>
    <rect x="18" y="20" width="84" height="62" rx="28" fill="url(#shell)"/>
    <path d="M32 27 Q60 18 88 27" stroke="#fff" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="27" y="33" width="66" height="36" rx="18" fill="url(#visor)"/>
    <path d="M35 39 L47 39 L41 52 L31 52 Z" fill="#fff" opacity="0.08"/>
    <g filter="url(#glow)" stroke="#a5f3fc" fill="#a5f3fc" stroke-linecap="round">
      <path d="M40 54 Q46 45 52 54" fill="none" stroke-width="4"/>
      <path d="M68 54 Q74 45 80 54" fill="none" stroke-width="4"/>
      <path d="M55 61 Q60 64 65 61" fill="none" stroke-width="2.5" opacity="0.8"/>
    </g>
  </g>
</svg>
